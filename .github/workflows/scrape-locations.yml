name: Scrape coffee locations

on:
  schedule:
    # Monday 08:00 Asia/Jakarta (WIB = UTC+7).
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Location keyword (Bandung coffee searches)'
        default: 'coffee in Bandung'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape-locations.yml'
      - 'scripts/scrape-locations.mjs'
      - 'scripts/scrape-locations.test.mjs'
      - 'scripts/enrich-links.mjs'
      - 'scripts/enrich-links.test.mjs'
      - 'scripts/curate-locations.mjs'
      - 'scripts/curation.test.mjs'
      - 'lib/curation.mjs'
      - 'scripts/enrich-photos.mjs'
      - 'scripts/photos.test.mjs'
      - 'lib/photo-extract.mjs'
      - 'lib/photo-fields.mjs'
      - 'scripts/discover-web.mjs'
      - 'scripts/discover-web.test.mjs'
      - 'lib/web-extract.mjs'
      - 'data/social-discovery-references.json'
      - 'data/discovery-references.json'
      - 'data/photo-references.json'

permissions:
  contents: write

concurrency:
  group: coffee-location-csv
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test scraper
        run: node --test scripts/scrape-locations.test.mjs scripts/enrich-links.test.mjs scripts/photos.test.mjs scripts/curation.test.mjs scripts/discover-web.test.mjs
      - name: Scrape locations and write CSV files
        # Source pushes reassess saved locations; weekly/manual runs refresh discovery too.
        if: github.event_name != 'push'
        env:
          SCRAPE_KEYWORD: ${{ inputs.keyword || 'coffee in Bandung' }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: node scripts/scrape-locations.mjs --keyword "$SCRAPE_KEYWORD" --output-dir data/scrapes
      - name: Expand discovery from local web and indexed TikTok recommendations
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: node scripts/discover-web.mjs
      - name: Find actual shop photos with source attribution
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: npm run photos:locations
      - name: Curate every CSV location after scraping and contact enrichment
        run: npm run curate:locations
      - name: Upload CSV snapshot
        uses: actions/upload-artifact@v4
        with:
          name: coffee-in-bandung-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/scrapes/*.csv
          if-no-files-found: error
          retention-days: 90
      - name: Save CSV files in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scrapes/*.csv data/scrapes/discovery-status.json
          if git diff --cached --quiet; then
            echo 'No CSV changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh coffee in Bandung CSV [skip ci]'
          # Keep any source changes pushed while the scraper was running.
          git pull --rebase origin main
          git push origin HEAD:main
